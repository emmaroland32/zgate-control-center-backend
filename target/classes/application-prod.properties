# ─── Production profile overrides ────────────────────────────────────────────
# Activated by: SPRING_PROFILES_ACTIVE=prod
# All secrets MUST be supplied via environment variables — no fallback defaults.

spring.devtools.restart.enabled=false

# Stricter Flyway in production
spring.flyway.out-of-order=false
spring.flyway.repair-on-migrate=false
spring.flyway.validate-on-migrate=true

# Logging — reduce noise, send to stdout for container log collectors
logging.level.root=WARN
logging.level.com.zgate.nexus=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
