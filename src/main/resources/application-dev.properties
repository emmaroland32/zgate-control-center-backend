# ─── Development profile overrides ──────────────────────────────────────────
# Activated by: --spring.profiles.active=dev (or SPRING_PROFILES_ACTIVE=dev)
# Default when no profile is set (see ControlCenterApplication.java setDefaultProfiles)

# NO signing secret is committed here. A checked-in value overrides ${JWT_SECRET} from .env, so a
# deployment that forgot SPRING_PROFILES_ACTIVE=prod would sign tokens with a key anyone can read
# from the source tree — forging SUPER_ADMIN. Dev without JWT_SECRET gets a random per-boot key
# from JwtUtils (tokens simply do not survive a restart).
controlcenter.jwt.secret=${JWT_SECRET:}
spring.devtools.restart.enabled=true

# Verbose SQL in dev
spring.jpa.show-sql=false
logging.level.com.zgate.controlcenter=DEBUG
