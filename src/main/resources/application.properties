spring.application.name=zgate-control-center

# Server
server.port=${SERVER_PORT:8090}

# Database — standalone zgate_control_center database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zgate_control_center}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123Password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public

# Flyway — public schema of standalone DB
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false

# JWT — JWT_SECRET env var MUST be set in production (min 32 chars)
# Startup will fail intentionally if JWT_SECRET is not set in a non-dev profile
controlcenter.jwt.secret=${JWT_SECRET:}
controlcenter.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# CORS
controlcenter.cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:3002}

# Mail (for invoice delivery)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator
management.endpoints.web.exposure.include=health,info
# when-authorized, not always: /actuator/health is permitAll, so "always" published component-level
# detail (database reachability, disk, mail) to anonymous callers.
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false

# DevTools — auto-disabled in production profile via spring.devtools.restart.enabled=false
spring.devtools.restart.enabled=${DEVTOOLS_ENABLED:false}

# Env file — check both the working directory and the module root
spring.config.import=optional:file:.env[.properties],optional:file:control-center/backend/.env[.properties]

# License signing — RSA private key used to sign .lic bundles for org instances
# Set CONTROLCENTER_LICENSE_PRIVATE_KEY_PATH to the path of the PKCS8 RSA private key PEM file.
# The matching public key must be deployed on org servers at zgate.license.publicKeyPath.
controlcenter.license.privateKeyPath=${CONTROLCENTER_LICENSE_PRIVATE_KEY_PATH:license/control-center-license-private.pem}

# Control Center settings
controlcenter.billing.taxRate=${TAX_RATE:0.15}
controlcenter.billing.invoiceDueDays=${INVOICE_DUE_DAYS:30}
controlcenter.billing.currencyDefault=${DEFAULT_CURRENCY:USD}
controlcenter.health.checkTimeoutSeconds=${HEALTH_CHECK_TIMEOUT:5}

# ── Fleet operations ─────────────────────────────────────────────────────────
# Staged version rollouts across customer stacks (canary wave -> waves, halt on failure).
controlcenter.fleet.rollout.enabled=${FLEET_ROLLOUT_ENABLED:true}
controlcenter.fleet.rollout.tickMs=${FLEET_ROLLOUT_TICK_MS:20000}
# Liveness sweep: an org silent past the threshold goes OFFLINE (+ critical alert); a heartbeat
# brings it back. PROVISIONING orgs flip to HEALTHY on their first heartbeat.
controlcenter.fleet.health.enabled=${FLEET_HEALTH_ENABLED:true}
controlcenter.fleet.health.offlineAfterMinutes=${FLEET_OFFLINE_AFTER_MINUTES:15}
controlcenter.fleet.health.sweepMs=${FLEET_HEALTH_SWEEP_MS:60000}
# Fleet overview thresholds.
controlcenter.fleet.backupStaleHours=${FLEET_BACKUP_STALE_HOURS:26}
controlcenter.fleet.subscriptionLapseWarnDays=${FLEET_LAPSE_WARN_DAYS:30}
# Nightly drift check. OFF by default: every refresh is a real terraform run against a customer
# cloud. The cap rotates a large fleet across nights instead of launching one runner per stack.
controlcenter.fleet.driftCheck.enabled=${FLEET_DRIFT_CHECK_ENABLED:false}
controlcenter.fleet.driftCheck.cron=${FLEET_DRIFT_CHECK_CRON:0 0 4 * * *}
controlcenter.fleet.driftCheck.maxPerRun=${FLEET_DRIFT_CHECK_MAX_PER_RUN:5}

# ── Console security ─────────────────────────────────────────────────────────
# Login lockout: without it the 6-digit second factor is brute-forceable and the endpoint is an
# unthrottled password oracle. Backoff doubles per failure past the threshold.
controlcenter.auth.lockout.threshold=${AUTH_LOCKOUT_THRESHOLD:5}
controlcenter.auth.lockout.baseMinutes=${AUTH_LOCKOUT_BASE_MINUTES:1}
controlcenter.auth.lockout.maxMinutes=${AUTH_LOCKOUT_MAX_MINUTES:60}
# Password policy, enforced on operator create and password change. The console's Security tab
# displays these values read-only — it does not set them, so what is shown is what is applied.
controlcenter.auth.password.minLength=${AUTH_PASSWORD_MIN_LENGTH:12}
controlcenter.auth.password.requireMixedCase=${AUTH_PASSWORD_MIXED_CASE:true}
controlcenter.auth.password.requireDigit=${AUTH_PASSWORD_DIGIT:true}
controlcenter.auth.password.requireSymbol=${AUTH_PASSWORD_SYMBOL:false}
# Comma-separated proxy addresses whose X-Forwarded-For may set the audited client IP. Empty means
# the header is ignored entirely (audit records the direct peer) — set this when behind a LB.
controlcenter.security.trustedProxies=${TRUSTED_PROXIES:}
# Webhook targets must be external https endpoints. Relax ONLY for a local test receiver: enabling
# this re-opens delivery to loopback/RFC1918/metadata addresses from the Control Center host.
controlcenter.webhooks.allowInsecureTargets=${WEBHOOKS_ALLOW_INSECURE_TARGETS:false}

# Per-customer cloud cost ingestion (margin = subscription fee - infra cost). OFF by default:
# Cost Explorer charges per request and needs ce:GetCostAndUsage + the zgate:org-id tag activated
# as a cost allocation tag in the AWS billing console. Only meaningful for vendor-hosted stacks.
controlcenter.cost.enabled=${COST_TRACKING_ENABLED:false}
controlcenter.cost.aws.region=${COST_AWS_REGION:eu-west-2}
controlcenter.cost.monthsBack=${COST_MONTHS_BACK:2}
controlcenter.cost.cron=${COST_SYNC_CRON:0 30 5 * * *}

# Rollout maker-checker: when on, a rollout starts only after a DIFFERENT operator approves it.
controlcenter.fleet.rollout.requireApproval=${FLEET_ROLLOUT_REQUIRE_APPROVAL:false}

# Alert delivery — pushes FIRING alerts to operator inboxes and enabled webhooks (at-least-once,
# bounded retry). Blank emails + no webhooks = in-app inbox only (the alert is marked delivered).
controlcenter.alerts.dispatch.enabled=${ALERT_DISPATCH_ENABLED:true}
controlcenter.alerts.dispatch.emails=${ALERT_DISPATCH_EMAILS:}
controlcenter.alerts.dispatch.sweepMs=${ALERT_DISPATCH_SWEEP_MS:30000}
controlcenter.alerts.dispatch.maxAttempts=${ALERT_DISPATCH_MAX_ATTEMPTS:5}

# Subscription renewal invoicing: raise a SUBSCRIPTION invoice leadDays before the paid-through
# date; marking it PAID extends Organization.subscriptionValidUntil to the invoice period end.
# Only orgs with BOTH subscriptionValidUntil and subscriptionMonthlyFee set are ever invoiced.
controlcenter.billing.renewal.enabled=${BILLING_RENEWAL_ENABLED:true}
controlcenter.billing.renewal.leadDays=${BILLING_RENEWAL_LEAD_DAYS:30}
controlcenter.billing.renewal.termMonths=${BILLING_RENEWAL_TERM_MONTHS:12}
controlcenter.billing.renewal.cron=${BILLING_RENEWAL_CRON:0 0 3 * * *}

# Commercial protection — license renewal kill switch (Layer 3)
controlcenter.license.autoRenew=${LICENSE_AUTO_RENEW:true}
controlcenter.license.renewalWindowDays=${LICENSE_RENEWAL_WINDOW_DAYS:10}
controlcenter.license.renewalCron=${LICENSE_RENEWAL_CRON:0 30 2 * * *}
# Telemetry anomaly radar (Layer 6)
controlcenter.anomaly.enabled=${ANOMALY_DETECTION_ENABLED:true}
controlcenter.anomaly.dedupeWindowHours=${ANOMALY_DEDUPE_WINDOW_HOURS:12}

# Managed backup ("ZGATE Cloud") — a paid, zero-knowledge DB-backup service. OFF until an S3 bucket
# is set (no accidental data egress). Only ever stores client-encrypted ciphertext; AWS creds come
# from the standard provider chain (instance role / env), never from here.
controlcenter.backup.enabled=${BACKUP_ENABLED:false}
controlcenter.backup.s3.bucket=${BACKUP_S3_BUCKET:}
controlcenter.backup.s3.region=${BACKUP_S3_REGION:eu-west-2}
# Optional customer-managed KMS key (id or ARN). Blank => SSE-S3 (AES256); set => SSE-KMS under this key.
controlcenter.backup.s3.kmsKeyId=${BACKUP_S3_KMS_KEY_ID:}
controlcenter.backup.presignTtlMinutes=${BACKUP_PRESIGN_TTL_MIN:30}
controlcenter.backup.expirySweepMs=${BACKUP_EXPIRY_SWEEP_MS:3600000}
controlcenter.anomaly.versionGranularity=${ANOMALY_VERSION_GRANULARITY:minor}
# Image-pull authorization (Layer 4). ECR credential minting is OFF by default; when enabled, AWS
# creds come from the standard provider chain (instance role / env).
controlcenter.pullToken.versionGranularity=${PULL_TOKEN_VERSION_GRANULARITY:minor}
controlcenter.registry.ecr.enabled=${REGISTRY_ECR_ENABLED:false}
controlcenter.registry.ecr.region=${REGISTRY_ECR_REGION:eu-west-2}
# Enforce the org service API key on machine-to-machine endpoints (telemetry/bundle/pull-token).
# Default false so existing installs (which don't send the key yet) keep working; enable once installs
# are configured with CONTROLCENTER_SERVICE_KEY (from org create / regenerate-key).
controlcenter.serviceKey.enforce=${CONTROLCENTER_SERVICE_KEY_ENFORCE:false}

# ── Cloud provisioning ───────────────────────────────────────────────────────
# Stands a full ZGATE deployment up in a CUSTOMER's cloud (AWS ECS/EC2, Azure Container Apps, GCP
# Cloud Run) by running Terraform in a throwaway container. OFF by default and entirely inert until
# both the runner and a state bucket are configured — see control-center/deploy/README.md.
controlcenter.provisioning.enabled=${PROVISIONING_ENABLED:false}
controlcenter.provisioning.containerRuntime=${PROVISIONING_CONTAINER_RUNTIME:docker}
controlcenter.provisioning.runnerImage=${PROVISIONING_RUNNER_IMAGE:zgate-provisioning-runner:1.0.0}
# Absolute path to the deploy/ directory holding the Terraform stacks. Mounted read-only into the
# runner, so a run can never mutate the shipped modules.
controlcenter.provisioning.deployDir=${PROVISIONING_DEPLOY_DIR:}
controlcenter.provisioning.workDir=${PROVISIONING_WORK_DIR:/var/lib/zgate-control-center/provisioning}
controlcenter.provisioning.pluginCacheVolume=${PROVISIONING_PLUGIN_CACHE_VOLUME:zgate-tf-plugin-cache}
# An apply that provisions a VPC, RDS and a cache legitimately takes 20-40 minutes.
controlcenter.provisioning.timeoutSeconds=${PROVISIONING_TIMEOUT_SECONDS:3600}

# Terraform remote state — VENDOR-owned, never the customer's. State holds generated database
# passwords and the field-encryption key in plaintext, so the bucket MUST be SSE-KMS encrypted,
# versioned and closed to public access. Vendor ownership is also what lets Control Center still
# plan or destroy a stack after a customer rotates their own credentials.
controlcenter.provisioning.state.bucket=${PROVISIONING_STATE_BUCKET:}
controlcenter.provisioning.state.region=${PROVISIONING_STATE_REGION:eu-west-2}
controlcenter.provisioning.state.kmsKeyId=${PROVISIONING_STATE_KMS_KEY_ID:}
controlcenter.provisioning.state.lockTable=${PROVISIONING_STATE_LOCK_TABLE:}
# Leave blank to use the host's default AWS provider chain (instance role) for the state bucket.
controlcenter.provisioning.state.accessKeyId=${PROVISIONING_STATE_ACCESS_KEY_ID:}
controlcenter.provisioning.state.secretAccessKey=${PROVISIONING_STATE_SECRET_ACCESS_KEY:}

# Encryption for stored cloud credentials (AES-256-GCM, per-purpose key derived via HMAC-SHA-256).
# Generate with: openssl rand -base64 32
# Without this, only AWS_ASSUME_ROLE credentials — which store no secret at all — can be saved.
# Rotation: put every key ever used in encryptionKeys as '<kid>:<base64>,<kid>:<base64>' and point
# activeKeyId at the newest. A retired key must STAY in the list or its rows become unreadable.
controlcenter.provisioning.encryptionKey=${PROVISIONING_ENCRYPTION_KEY:}
controlcenter.provisioning.encryptionKeys=${PROVISIONING_ENCRYPTION_KEYS:}
controlcenter.provisioning.activeKeyId=${PROVISIONING_ACTIVE_KEY_ID:v1}

# Vendor release registry the runner mirrors images FROM. Pull-only credentials — this must never be
# able to push. Blank falls back to the host's default AWS provider chain.
controlcenter.provisioning.registry=${PROVISIONING_REGISTRY:}
controlcenter.provisioning.webImageRepository=${PROVISIONING_WEB_IMAGE_REPOSITORY:}
controlcenter.provisioning.sourceRegistry.accessKeyId=${PROVISIONING_SRC_REGISTRY_ACCESS_KEY_ID:}
controlcenter.provisioning.sourceRegistry.secretAccessKey=${PROVISIONING_SRC_REGISTRY_SECRET_ACCESS_KEY:}
controlcenter.provisioning.sourceRegistry.region=${PROVISIONING_SRC_REGISTRY_REGION:eu-west-2}
# Cosign public key (PEM). When set, the runner verifies the vendor image signature BEFORE mirroring
# and refuses to deploy an image that is not signed by the ZGATE release key.
controlcenter.provisioning.cosignPublicKey=${PROVISIONING_COSIGN_PUBLIC_KEY:}

# Public URL of Control Center as a DEPLOYED CUSTOMER INSTANCE sees it — not localhost. Provisioned
# instances use it for licence sync, telemetry and the managed-backup agent, so it must be reachable
# from the customer's private subnets.
controlcenter.publicUrl=${CONTROLCENTER_PUBLIC_URL:}
