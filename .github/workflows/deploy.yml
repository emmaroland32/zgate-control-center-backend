name: Deploy to AWS ECR, EC2

# Builds the Control-Center backend image, pushes to ECR, then
# `docker compose up -d controlcenter-backend` on the host. Requires repo secrets:
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, SSH_HOST, SSH_USER, SSH_PRIVATE_KEY,
# SSH_PORT (optional), DEPLOY_PATH. The server must already hold this service's
# .env + license key (see backend/setup.md §10.6).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'test/**'
      - 'coverage/**'
      - '.vscode/**'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    outputs:
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}
      ecr-repository: zgate-control-center-backend
      image-tag: latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names zgate-control-center-backend --region eu-west-2 \
            || aws ecr create-repository --repository-name zgate-control-center-backend --region eu-west-2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to Amazon ECR
        uses: docker/build-push-action@v6
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: zgate-control-center-backend
          IMAGE_TAG: latest
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: build
    environment: development
    steps:
      - name: Deploy on server over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-2
          ECR_REGISTRY: ${{ needs.build.outputs.ecr-registry }}
          ECR_REPOSITORY: ${{ needs.build.outputs.ecr-repository }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,DEPLOY_PATH
          script_stop: true
          script: |
            set -e
            IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            echo "[deploy] image=$IMAGE"
            aws ecr get-login-password --region "$AWS_REGION" \
              | sudo docker login --username AWS --password-stdin "$ECR_REGISTRY"
            sudo docker pull "$IMAGE"
            cd "$DEPLOY_PATH"
            sudo docker compose up -d controlcenter-backend
            sudo docker image prune -f
            echo "[deploy] done"
